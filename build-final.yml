name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: "17"}}
      - {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: "8.7"}}
      - run: 'if ls *.zip >/dev/null 2>&1; then mkdir work; unzip -q -o *.zip -d work; fi; cd "$(dirname "$(find . -name settings.gradle | head -1)")" && gradle assembleDebug --no-daemon'
      - {uses: actions/upload-artifact@v4, with: {name: HesabeMan-APK, path: "**/app/build/outputs/apk/debug/*.apk", if-no-files-found: error}}
